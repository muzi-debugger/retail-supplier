
spring:
  application:
    name: supplier-simulator

  config:
    # Reads the same .env Docker Compose uses, so no shell preface is needed to run the app.
    import:
      - optional:file:./.env[.properties]
      - optional:file:./supplier-simulator/.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5435/${POSTGRES_SUPPLIER_DB}
    username: ${POSTGRES_SUPPLIER_USER}
    password: ${POSTGRES_SUPPLIER_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate # ensures Hibernate does not create or modify our database schema. Flyway will own that responsibility
    open-in-view: false # keeps persistence operations out of the HTTP response-rendering lifecycle.
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha