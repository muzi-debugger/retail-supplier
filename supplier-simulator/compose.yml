
services:
  postgres:
    image: postgres:17
    container_name: sneaker-street-supplier-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_SUPPLIER_DB}
      POSTGRES_USER: ${POSTGRES_SUPPLIER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPPLIER_PASSWORD}

    ports:
      - "127.0.0.1:5435:5432"

    volumes:
      - supplier_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supplier_postgres_data:
