
name: Supplier Simulator CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Integration Tests
    runs-on: ubuntu-latest

    # The Maven project (and its pom.xml) lives in this subdirectory, not at the repo root.
    defaults:
      run:
        working-directory: supplier-simulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build and run tests
        run: ./mvnw --batch-mode clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-test-reports
          # artifact paths are resolved from the workspace root, not from the step's working-directory
          path: supplier-simulator/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
